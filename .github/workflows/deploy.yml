name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Hourly rebuild: bakes the channel's newest uploads into the static HTML.
    - cron: "15 * * * *"
    # Daily: keepalive + (only if needed) the stale-data alert, see the jobs below.
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      youtube-stale: ${{ steps.freshness.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in .git/config during npm ci.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # No API keys or secrets: YouTube data comes from public, keyless feeds.
      - name: Build
        run: npm run build

      - name: Check YouTube data freshness
        id: freshness
        run: node scripts/check-youtube-freshness.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          # Dot-directories are skipped by default; needed for /.well-known/security.txt.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  keepalive:
    # GitHub disables scheduled workflows in public repositories after 60 days
    # without repository activity, which would silently freeze the hourly
    # YouTube refresh. Re-enabling the workflow through the API resets that
    # timer — no dummy commits and no third-party action needed.
    if: github.event_name == 'schedule' && github.event.schedule == '45 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep scheduled rebuilds enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_file="${GITHUB_WORKFLOW_REF%%@*}"
          workflow_file="${workflow_file##*/}"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/enable"
          echo "Scheduled workflow ${workflow_file} kept enabled."

  youtube-alert:
    # Turns a silent "Latest Videos stopped updating" into a failed run (and
    # GitHub's failure e-mail) at most once a day. The site is already deployed
    # with the last good data at this point; nothing visitors see is affected.
    needs: [build, deploy]
    if: needs.build.outputs.youtube-stale == 'true' && (github.event_name != 'schedule' || github.event.schedule == '45 4 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report stale YouTube data
        run: |
          echo "::error title=Latest Videos is not updating::YouTube's public feeds could not be read for more than 72 hours. The site is still online with the last good data. See the [youtube] line in the Build step log; if the channel ID ever changes, update channelId in src/lib/site.ts."
          exit 1
